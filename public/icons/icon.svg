<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Radar Concentric Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#475569" stroke-width="2.5" opacity="0.7"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#64748b" stroke-width="3" opacity="0.85"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Radar Sweep Sector -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 0 256 66 Z" fill="url(#beam)"/>

  <!-- Satellite / Radar Center Blip -->
  <circle cx="256" cy="256" r="10" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Detected High-Yield Vocabulary Blips -->
  <circle cx="340" cy="180" r="7" fill="#10b981" filter="url(#glow)"/>
  <circle cx="180" cy="330" r="6" fill="#6366f1" filter="url(#glow)"/>
  <circle cx="310" cy="320" r="8" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="170" cy="190" r="6" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Satellite Dish Icon Silhouette -->
  <path d="M 226 286 C 226 269 240 256 256 256 C 272 256 286 269 286 286" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
</svg>
